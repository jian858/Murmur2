<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Murmur</title>
  <style>
    :root {
      --bg: #edf4f1;
      --panel: rgba(255,255,255,0.72);
      --ink: #14213d;
      --muted: #6a778c;
      --line: rgba(20,33,61,0.12);
      --acc: #14c8a0;
      --acc-strong: #0aa981;
      --on: #04261e;
      --shadow: 0 20px 50px rgba(14, 32, 46, 0.12);
      --danger: #b3261e;
      --warning: #d18b14;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #dff8f0 0%, var(--bg) 26%, #eef3f8 100%);
      color: var(--ink);
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    .app-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      width: min(980px, 100%);
      display: grid;
      grid-template-columns: 1.2fr 420px;
      gap: 42px;
      align-items: center;
      padding: 20px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 10px 10px 10px 8px;
      background: var(--acc);
      display: inline-block;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(2.8rem, 7vw, 5rem);
      letter-spacing: -0.06em;
      line-height: 0.9;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand p {
      margin: 0;
      max-width: 520px;
      font-size: clamp(1.1rem, 2vw, 1.8rem);
      line-height: 1.25;
      color: var(--muted);
    }

    .panel {
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 20px;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--ink);
      outline: none;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--acc);
      box-shadow: 0 0 0 4px rgba(20,200,160,0.12);
    }
    textarea { min-height: 90px; resize: vertical; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .password-wrap {
      position: relative;
    }
    .password-wrap input { padding-right: 48px; }
    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
    }

    .password-feedback {
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 18px;
    }
    .password-feedback strong { display: inline-block; min-width: 62px; }

    .strength-bar {
      height: 8px;
      width: 100%;
      background: rgba(20,33,61,0.08);
      border-radius: 999px;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      width: 0%;
      background: var(--danger);
      border-radius: inherit;
      transition: width 0.2s ease, background 0.2s ease;
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 14px 16px;
      font-weight: 700;
      transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease;
      width: 100%;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: scale(0.99); }
    .btn.primary {
      background: var(--acc);
      color: var(--on);
    }
    .btn.secondary {
      background: transparent;
      color: var(--ink);
      border: 1.5px solid var(--ink);
    }
    .btn.ghost {
      background: rgba(20,33,61,0.04);
      color: var(--ink);
    }
    .btn.small {
      width: auto;
      padding: 10px 14px;
      font-size: 0.85rem;
    }

    .tiny {
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .tiny button {
      background: none;
      border: none;
      color: var(--ink);
      text-decoration: underline;
      padding: 0;
      font-weight: 700;
    }

    .error {
      min-height: 18px;
      color: var(--danger);
      font-weight: 700;
      font-size: 0.9rem;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: 10px 18px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: -0.04em;
      font-size: 1.4rem;
    }
    .nav {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex: 1;
    }
    .nav button {
      background: transparent;
      border: 0;
      color: var(--muted);
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 700;
    }
    .nav button.active {
      background: rgba(20,33,61,0.06);
      color: var(--ink);
    }
    .menu-btn {
      background: rgba(20,33,61,0.06);
      color: var(--ink);
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
    }

    .main {
      max-width: 980px;
      margin: 22px auto 80px;
      padding: 0 14px;
    }
    .pane {
      display: none;
    }
    .pane.active { display: block; }

    .composer, .card {
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }
    .composer {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 12px;
      align-items: center;
    }
    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      background: linear-gradient(135deg, var(--acc), #d4f8ea);
      color: var(--on);
      font-size: 1.05rem;
    }
    .composer input {
      background: rgba(20,33,61,0.04);
      border: 1px solid transparent;
    }

    .posts,
    .chat-list,
    .alerts-list,
    .friends-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 18px;
    }

    .post {
      padding: 18px 18px 14px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    .post-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .meta small { color: var(--muted); }
    .post p { margin: 0; line-height: 1.5; }
    .post-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }
    .post-actions button {
      background: transparent;
      border: 0;
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 10px;
      font-weight: 700;
    }
    .post-actions button.active {
      background: rgba(20,200,160,0.12);
      color: var(--on);
    }

    .chat-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 14px;
    }
    .sidebar, .conversation {
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .sidebar-header {
      padding: 16px 18px 10px;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.05em;
    }
    .search {
      padding: 0 14px 10px;
    }
    .search input {
      background: rgba(20,33,61,0.04);
      border: 1px solid transparent;
    }
    .chat-item {
      display: flex;
      gap: 10px;
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      align-items: center;
      cursor: pointer;
      width: 100%;
      background: transparent;
      color: inherit;
      text-align: left;
    }
    .chat-item.active {
      background: rgba(20,33,61,0.05);
    }
    .chat-item .avatar { width: 42px; height: 42px; font-size: 0.9rem; }
    .chat-item h4, .chat-item p { margin: 0; }
    .chat-item p { color: var(--muted); font-size: 0.9rem; }
    .chat-item .time { margin-left: auto; color: var(--muted); font-size: 0.75rem; }

    .conversation {
      display: flex;
      flex-direction: column;
      min-height: 560px;
    }
    .conversation-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .conversation-header .meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .messages {
      flex: 1;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: auto;
    }
    .bubble {
      max-width: 70%;
      padding: 12px 14px;
      border-radius: 18px;
      line-height: 1.4;
      background: rgba(20,33,61,0.05);
      color: var(--ink);
      align-self: flex-start;
    }
    .bubble.me {
      align-self: flex-end;
      background: var(--acc);
      color: var(--on);
    }
    .composer-chat {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 14px 16px 18px;
      border-top: 1px solid var(--line);
    }

    .notice {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .notice .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--acc);
      margin-top: 8px;
      flex-shrink: 0;
    }
    .notice h4, .notice p { margin: 0; }
    .notice small { color: var(--muted); }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 24px 10px 10px;
    }

    .tip {
      background: rgba(20,200,160,0.08);
      border: 1px solid rgba(20,200,160,0.25);
      color: var(--ink);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 0.92rem;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 19, 28, 0.55);
      display: grid;
      place-items: center;
      padding: 20px;
      z-index: 200;
    }
    .modal {
      width: min(760px, 100%);
      max-height: min(88vh, 900px);
      overflow: auto;
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--line);
      box-shadow: 0 24px 70px rgba(15,20,25,0.25);
      border-radius: 28px;
      padding: 20px 18px 18px;
      backdrop-filter: blur(12px);
    }
    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .modal-header h3 {
      margin: 0;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      letter-spacing: -0.05em;
    }
    .modal-header small {
      color: var(--muted);
      display: block;
      margin-top: 2px;
    }
    .close-btn {
      border: 0;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(20,33,61,0.06);
      color: var(--ink);
      font-size: 1.2rem;
      font-weight: 700;
    }

    .stepper {
      display: flex;
      gap: 8px;
      margin: 10px 0 18px;
      flex-wrap: wrap;
    }
    .step-pill {
      flex: 1;
      min-width: 120px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(20,33,61,0.04);
      color: var(--muted);
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .step-pill.active {
      background: rgba(20,200,160,0.14);
      color: var(--ink);
    }

    .step-body {
      display: none;
      gap: 12px;
    }
    .step-body.active { display: grid; }

    .interest-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }
    .interest-option {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(20,33,61,0.02);
      cursor: pointer;
      user-select: none;
      font-size: 0.9rem;
    }
    .interest-option.selected {
      background: rgba(20,200,160,0.12);
      border-color: rgba(20,200,160,0.45);
      color: var(--ink);
    }

    .profile-preview {
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(20,33,61,0.04);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      margin-top: 4px;
    }
    .profile-preview .avatar {
      width: 62px;
      height: 62px;
    }
    .profile-preview h4, .profile-preview p { margin: 0; }
    .profile-preview p { color: var(--muted); }

    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 4px;
      color: var(--muted);
      line-height: 1.45;
    }
    .checkbox-row input { width: 18px; height: 18px; margin-top: 2px; }
    .checkbox-row a { color: var(--ink); }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    @media (max-width: 780px) {
      .auth-card { grid-template-columns: 1fr; }
      .chat-layout { grid-template-columns: 1fr; }
      .conversation { min-height: 420px; }
      .nav { justify-content: space-between; }
      .nav button { padding: 10px 8px; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-live="polite">
    <div class="app-shell">
      <div style="display:flex;flex-direction:column;align-items:center;gap:18px;transform:translateY(-8px)">
        <div style="width:90px;height:90px;border-radius:26px 26px 26px 12px;background:var(--acc);box-shadow:var(--shadow);animation: pop 0.7s ease both;"></div>
        <div style="font-size:clamp(2.1rem,7vw,3.3rem);font-weight:800;letter-spacing:-.06em;">murmur</div>
        <div style="color:var(--muted)">Chat, share and watch together</div>
      </div>
    </div>
  </div>

  <div id="auth" hidden>
    <div class="app-shell">
      <div class="auth-card">
        <div class="brand">
          <h1><span class="brand-mark" aria-hidden="true"></span>murmur</h1>
          <p>Murmur helps you chat, share and watch reels with the people in your life.</p>
        </div>

        <div class="panel">
          <div class="form" id="authForm">
            <div class="field">
              <label for="email">Email Address</label>
              <input id="email" type="email" autocomplete="username" placeholder="you@example.com" />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
            </div>
            <div class="error" id="authError"></div>
            <button class="btn primary" id="loginBtn" type="button">Log in</button>
            <button class="btn secondary" id="createBtn" type="button">Create new account</button>
            <div class="tiny"><button id="resetBtn" type="button">Forgot password?</button></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand-row"><span class="brand-mark"></span>murmur</div>
      <nav class="nav" aria-label="Main navigation">
        <button class="active" data-view="home" type="button">Home</button>
        <button data-view="friends" type="button">Friends</button>
        <button data-view="chats" type="button">Chats</button>
        <button data-view="alerts" type="button">Alerts</button>
      </nav>
      <button class="menu-btn" id="logoutBtn" type="button">Log out</button>
    </header>

    <main class="main">
      <section class="pane active" data-pane="home">
        <div class="tip">Welcome back — your demo feed is running locally in this browser.</div>
        <div class="composer">
          <div class="avatar" id="composerAvatar">MC</div>
          <input id="postInput" type="text" maxlength="200" placeholder="What’s on your mind?" />
          <button class="btn primary" id="postBtn" type="button">Post</button>
        </div>
        <div class="posts" id="posts"></div>
      </section>

      <section class="pane" data-pane="friends">
        <div class="card">
          <h2 style="margin:0 0 14px">Friends</h2>
          <div id="friendsList" class="friends-list"></div>
        </div>
      </section>

      <section class="pane" data-pane="chats">
        <div class="chat-layout">
          <aside class="sidebar">
            <div class="sidebar-header">Chats</div>
            <div class="search"><input id="chatSearch" type="text" placeholder="Search people" /></div>
            <div id="chatList" class="chat-list"></div>
          </aside>

          <div class="conversation">
            <div class="conversation-header">
              <div class="meta">
                <div class="avatar" id="chatAvatar">A</div>
                <div>
                  <strong id="chatName">Ava</strong><br />
                  <small id="chatStatus">online</small>
                </div>
              </div>
              <button class="btn ghost" type="button">More</button>
            </div>
            <div class="messages" id="messages"></div>
            <div class="composer-chat">
              <input id="messageInput" type="text" placeholder="Write a message" maxlength="300" />
              <button class="btn primary" id="sendBtn" type="button">Send</button>
            </div>
          </div>
        </div>
      </section>

      <section class="pane" data-pane="alerts">
        <div class="alerts-list" id="alertsList"></div>
      </section>
    </main>
  </div>

  <script>
    const DEFAULT_STATE = {
      loggedIn: false,
      currentUser: { name: 'Maya Chen', email: 'maya@example.com', username: '@maya' },
      users: {
        me: { name: 'Maya Chen', email: 'maya@example.com', username: '@maya' },
        ava: { name: 'Ava Patel', email: 'ava@example.com', username: '@avap' },
        leo: { name: 'Leo Ortiz', email: 'leo@example.com', username: '@leo' },
        noah: { name: 'Noah Kim', email: 'noah@example.com', username: '@noah' }
      },
      posts: [
        { id: 1, author: 'me', text: 'Morning coffee and a fresh start. Anyone else trying a tiny reset this week?', likes: 12, liked: false },
        { id: 2, author: 'ava', text: 'That sunset from the roof was unreal. We should do it again this weekend!', likes: 42, liked: true },
        { id: 3, author: 'leo', text: 'Spent the afternoon fixing the prototype. Progress feels good.', likes: 19, liked: false }
      ],
      conversations: {
        ava: [
          { from: 'ava', text: 'Hey! Want to grab coffee after work?', time: '9:12 AM' },
          { from: 'me', text: 'Yes, absolutely. Let’s do 6:30.', time: '9:13 AM' },
          { from: 'ava', text: 'Perfect — I’ll pick the spot.', time: '9:14 AM' }
        ],
        leo: [
          { from: 'leo', text: 'Can you review the mockup before lunch?', time: '8:55 AM' },
          { from: 'me', text: 'On it — I’ll send feedback in 20 minutes.', time: '8:57 AM' }
        ],
        noah: [
          { from: 'noah', text: 'The new build is looking solid.', time: 'Yesterday' }
        ]
      },
      alerts: [
        { id: 1, title: 'Ava liked your post', text: 'Your morning coffee update made someone smile.', time: '2 min ago', unread: true },
        { id: 2, title: 'You matched with Leo', text: 'He shared a new prototype idea with you.', time: '1 hr ago', unread: false },
        { id: 3, title: 'Noah sent a message', text: 'The new build is looking solid.', time: 'Today', unread: true }
      ],
      activeChat: 'ava',
      activeView: 'home'
    };

    const state = loadState();
    const authEl = document.getElementById('auth');
    const appEl = document.getElementById('app');
    const splash = document.getElementById('splash');
    const authError = document.getElementById('authError');

    function saveState() {
      localStorage.setItem('murmur-demo-state', JSON.stringify(state));
    }

    function loadState() {
      try {
        const parsed = JSON.parse(localStorage.getItem('murmur-demo-state') || 'null');
        return parsed ? { ...DEFAULT_STATE, ...parsed, users: { ...DEFAULT_STATE.users, ...(parsed.users || {}) }, conversations: { ...DEFAULT_STATE.conversations, ...(parsed.conversations || {}) }, posts: parsed.posts || DEFAULT_STATE.posts, alerts: parsed.alerts || DEFAULT_STATE.alerts, activeChat: parsed.activeChat || 'ava', activeView: parsed.activeView || 'home' } : JSON.parse(JSON.stringify(DEFAULT_STATE));
      } catch {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    function initials(name) {
      return (name || 'M').split(/\s+/).filter(Boolean).slice(0, 2).map(part => part[0].toUpperCase()).join('') || 'M';
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.textContent = message;
      toast.style.position = 'fixed';
      toast.style.bottom = '24px';
      toast.style.left = '50%';
      toast.style.transform = 'translateX(-50%)';
      toast.style.background = 'rgba(20,33,61,0.88)';
      toast.style.color = '#fff';
      toast.style.padding = '10px 14px';
      toast.style.borderRadius = '999px';
      toast.style.zIndex = '300';
      toast.style.fontWeight = '700';
      toast.style.fontSize = '0.9rem';
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2400);
    }

    function showAuth() {
      authEl.hidden = false;
      appEl.hidden = true;
      document.getElementById('email').focus();
      authError.textContent = '';
    }

    function showApp() {
      authEl.hidden = true;
      appEl.hidden = false;
      renderAll();
    }

    function getCurrentUserName() {
      return state.currentUser?.name || 'Maya Chen';
    }

    function getUserById(id) {
      return state.users[id] || { name: 'Someone', email: '', username: '@someone' };
    }

    function renderPosts() {
      const postsEl = document.getElementById('posts');
      postsEl.innerHTML = '';
      if (!state.posts.length) {
        postsEl.innerHTML = '<div class="empty">No posts yet. Share something new.</div>';
        return;
      }
      state.posts.forEach(post => {
        const author = getUserById(post.author);
        const card = document.createElement('article');
        card.className = 'post';
        card.innerHTML = `
          <div class="post-head">
            <div class="meta">
              <div class="avatar">${initials(author.name)}</div>
              <div>
                <strong>${author.name}</strong><br />
                <small>${author.username || '@user'}</small>
              </div>
            </div>
          </div>
          <p>${post.text}</p>
          <div class="post-actions">
            <button class="${post.liked ? 'active' : ''}" data-like="${post.id}" type="button">♡ ${post.likes}</button>
            <button type="button">💬 3</button>
            <button type="button">↗ Share</button>
          </div>
        `;
        postsEl.appendChild(card);
      });
    }

    function renderFriends() {
      const list = document.getElementById('friendsList');
      list.innerHTML = '';
      Object.entries(state.users).forEach(([id, user]) => {
        if (id === 'me') return;
        const row = document.createElement('div');
        row.className = 'notice';
        row.innerHTML = `
          <div class="avatar">${initials(user.name)}</div>
          <div>
            <h4>${user.name}</h4>
            <small>${user.username || '@user'}</small>
            <p style="margin-top:6px">Want to hang out soon?</p>
          </div>
        `;
        list.appendChild(row);
      });
    }

    function renderChats() {
      const list = document.getElementById('chatList');
      list.innerHTML = '';
      const ids = Object.keys(state.conversations || {}).filter(id => id !== 'me');
      ids.forEach(id => {
        const user = getUserById(id);
        const messages = state.conversations[id] || [];
        const last = messages[messages.length - 1];
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'chat-item' + (state.activeChat === id ? ' active' : '');
        item.innerHTML = `
          <div class="avatar">${initials(user.name)}</div>
          <div style="flex:1;min-width:0;text-align:left;">
            <h4>${user.name}</h4>
            <p>${last ? last.text : 'No messages yet'}</p>
          </div>
          <div class="time">${last ? (last.time || 'now') : ''}</div>
        `;
        item.addEventListener('click', () => {
          state.activeChat = id;
          saveState();
          renderChats();
          renderConversation();
        });
        list.appendChild(item);
      });

      const current = getUserById(state.activeChat || 'ava');
      document.getElementById('chatAvatar').textContent = initials(current.name);
      document.getElementById('chatName').textContent = current.name;
      document.getElementById('chatStatus').textContent = 'online';
    }

    function renderConversation() {
      const container = document.getElementById('messages');
      const chatId = state.activeChat || 'ava';
      const messages = state.conversations[chatId] || [];
      container.innerHTML = '';
      messages.forEach(msg => {
        const bubble = document.createElement('div');
        bubble.className = 'bubble ' + (msg.from === 'me' ? 'me' : '');
        bubble.textContent = msg.text;
        container.appendChild(bubble);
      });
      container.scrollTop = container.scrollHeight;
    }

    function renderAlerts() {
      const list = document.getElementById('alertsList');
      list.innerHTML = '';
      if (!state.alerts.length) {
        list.innerHTML = '<div class="empty">No alerts</div>';
        return;
      }
      state.alerts.forEach(note => {
        const item = document.createElement('div');
        item.className = 'notice';
        item.innerHTML = `
          <span class="dot" style="background:${note.unread ? 'var(--acc)' : 'rgba(20,33,61,0.3)'}"></span>
          <div>
            <h4>${note.title}</h4>
            <small>${note.time}</small>
            <p>${note.text}</p>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function renderAll() {
      document.getElementById('composerAvatar').textContent = initials(getCurrentUserName());
      const navButtons = document.querySelectorAll('[data-view]');
      navButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === state.activeView);
      });
      document.querySelectorAll('.pane').forEach(pane => {
        pane.classList.toggle('active', pane.dataset.pane === state.activeView);
      });

      renderPosts();
      renderFriends();
      renderChats();
      renderConversation();
      renderAlerts();
    }

    function setView(view) {
      state.activeView = view;
      saveState();
      renderAll();
    }

    function getPasswordStrength(password) {
      let score = 0;
      if (password.length >= 8) score += 1;
      if (/[A-Z]/.test(password)) score += 1;
      if (/[0-9]/.test(password)) score += 1;
      if (/[^A-Za-z0-9]/.test(password)) score += 1;
      if (password.length >= 12) score += 1;
      if (score <= 2) return { score: 1, label: 'Weak', color: '#d84848' };
      if (score <= 4) return { score: 2, label: 'Fair', color: '#d18b14' };
      return { score: 3, label: 'Strong', color: '#14c8a0' };
    }

    function validateUsername(value) {
      const username = value.trim();
      if (!username) return 'Choose a username.';
      if (!/^@?[a-zA-Z0-9._-]{3,20}$/.test(username)) return 'Use 3–20 letters/numbers, periods, dashes, or underscores.';
      const normalized = username.startsWith('@') ? username : '@' + username;
      const taken = Object.values(state.users).some(user => (user.username || '').toLowerCase() === normalized.toLowerCase());
      if (taken) return 'That username is already taken.';
      return '';
    }

    function openRegisterWizard() {
      const overlay = document.createElement('div');
      overlay.className = 'modal-backdrop';
      overlay.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="register-title">
          <div class="modal-header">
            <div>
              <h3 id="register-title">Create your account</h3>
              <small>Join Murmur in a few easy steps.</small>
            </div>
            <button class="close-btn" type="button" aria-label="Close">×</button>
          </div>

          <div class="stepper">
            <div class="step-pill active">1. Account</div>
            <div class="step-pill">2. Profile</div>
            <div class="step-pill">3. Review</div>
          </div>

          <div class="step-body active" data-step="1">
            <div class="row">
              <div class="field">
                <label>First name</label>
                <input name="firstName" type="text" placeholder="First name" />
              </div>
              <div class="field">
                <label>Last name</label>
                <input name="lastName" type="text" placeholder="Last name" />
              </div>
            </div>
            <div class="row">
              <div class="field">
                <label>Middle name (optional)</label>
                <input name="middleName" type="text" placeholder="Middle name" />
              </div>
              <div class="field">
                <label>Birthday</label>
                <input name="birthday" type="date" />
              </div>
            </div>
            <div class="field">
              <label>Username</label>
              <input name="username" type="text" placeholder="@jian123" />
              <div class="error" data-user-error></div>
            </div>
            <div class="field">
              <label>Email address</label>
              <input name="email" type="email" placeholder="you@example.com" />
            </div>
            <div class="field">
              <label>Password</label>
              <div class="password-wrap">
                <input name="password" type="password" placeholder="Create a password" />
                <button class="password-toggle" type="button">Show</button>
              </div>
              <div class="strength-bar"><div class="strength-fill"></div></div>
              <div class="password-feedback"><strong>Weak</strong> Use 8+ characters and mix letters, numbers, symbols.</div>
            </div>
            <div class="field">
              <label>Confirm password</label>
              <div class="password-wrap">
                <input name="confirmPassword" type="password" placeholder="Confirm your password" />
                <button class="password-toggle" type="button">Show</button>
              </div>
            </div>
          </div>

          <div class="step-body" data-step="2">
            <div class="field">
              <label>Profile photo (optional)</label>
              <input name="photo" type="file" accept="image/*" />
            </div>
            <div class="field">
              <label>Short bio</label>
              <textarea name="bio" placeholder="Tell people a little about yourself..."></textarea>
            </div>
            <div class="row">
              <div class="field">
                <label>Gender</label>
                <select name="gender">
                  <option value="">Prefer not to say</option>
                  <option>Female</option>
                  <option>Male</option>
                  <option>Non-binary</option>
                </select>
              </div>
              <div class="field">
                <label>Location</label>
                <input name="location" type="text" placeholder="City, Country" />
              </div>
            </div>
            <div class="field">
              <label>School</label>
              <input name="school" type="text" placeholder="School or university" />
            </div>
            <div class="field">
              <label>Interests</label>
              <div class="interest-grid">
                <span class="interest-option">Music</span>
                <span class="interest-option">Gaming</span>
                <span class="interest-option">Anime</span>
                <span class="interest-option">Writing</span>
                <span class="interest-option">Photography</span>
                <span class="interest-option">Sports</span>
                <span class="interest-option">Technology</span>
                <span class="interest-option">Travel</span>
                <span class="interest-option">Art</span>
              </div>
            </div>
          </div>

          <div class="step-body" data-step="3">
            <div class="profile-preview">
              <div class="avatar" id="preview-avatar">U</div>
              <div>
                <h4 id="preview-name">Your name</h4>
                <p id="preview-username">@yourname</p>
              </div>
            </div>
            <div class="field">
              <label>Bio</label>
              <textarea id="preview-bio" readonly placeholder="No bio yet"></textarea>
            </div>
            <div class="field">
              <label>Summary</label>
              <div id="preview-summary" style="color:var(--muted); line-height:1.5; min-height:70px;"></div>
            </div>
            <label class="checkbox-row">
              <input type="checkbox" id="termsCheck" />
              <span>I agree to the <a href="#">Terms of Service</a>, <a href="#">Privacy Policy</a>, and I am 13+ years old.</span>
            </label>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn ghost" data-action="back">Back</button>
            <button type="button" class="btn primary" data-action="next">Next</button>
          </div>
        </div>
      `;

      document.body.appendChild(overlay);

      let step = 1;
      const form = overlay.querySelector('.modal');
      const stepPills = [...overlay.querySelectorAll('.step-pill')];
      const stepBodies = [...overlay.querySelectorAll('.step-body')];
      const nextButton = overlay.querySelector('[data-action="next"]');
      const backButton = overlay.querySelector('[data-action="back"]');
      const closeButton = overlay.querySelector('.close-btn');
      const usernameInput = overlay.querySelector('input[name="username"]');
      const passwordInput = overlay.querySelector('input[name="password"]');
      const confirmInput = overlay.querySelector('input[name="confirmPassword"]');
      const firstNameInput = overlay.querySelector('input[name="firstName"]');
      const lastNameInput = overlay.querySelector('input[name="lastName"]');
      const bioInput = overlay.querySelector('textarea[name="bio"]');
      const photoInput = overlay.querySelector('input[name="photo"]');

      const interestOptions = [...overlay.querySelectorAll('.interest-option')];
      const selectedInterests = new Set();
      interestOptions.forEach(opt => {
        opt.addEventListener('click', () => {
          const text = opt.textContent.trim();
          if (selectedInterests.has(text)) selectedInterests.delete(text);
          else selectedInterests.add(text);
          opt.classList.toggle('selected', selectedInterests.has(text));
        });
      });

      function updateStepUI() {
        stepPills.forEach((pill, idx) => pill.classList.toggle('active', idx + 1 === step));
        stepBodies.forEach(body => body.classList.toggle('active', Number(body.dataset.step) === step));
        backButton.style.visibility = step === 1 ? 'hidden' : 'visible';
        nextButton.textContent = step === 3 ? 'Create account' : 'Next';

        if (step === 3) {
          const first = (firstNameInput.value || 'Your').trim();
          const last = (lastNameInput.value || 'Name').trim();
          const username = (usernameInput.value || '@yourname').trim();
          const name = [first, last].filter(Boolean).join(' ') || 'Your Name';
          document.getElementById('preview-name').textContent = name;
          document.getElementById('preview-avatar').textContent = initials(name);
          document.getElementById('preview-username').textContent = username.startsWith('@') ? username : '@' + username;
          document.getElementById('preview-bio').value = bioInput.value || 'No bio yet';
          const summary = [
            `Name: ${name}`,
            `Username: ${username.startsWith('@') ? username : '@' + username}`,
            `Email: ${(overlay.querySelector('input[name="email"]').value || 'your@email.com').trim()}`,
            `Birthday: ${(overlay.querySelector('input[name="birthday"]').value || 'Not specified')}`,
            `Location: ${(overlay.querySelector('input[name="location"]').value || 'Not specified')}`,
            `Interests: ${selectedInterests.size ? [...selectedInterests].join(', ') : 'None selected'}`
          ].join(' • ');
          document.getElementById('preview-summary').textContent = summary;
        }
      }

      function updateStrength() {
        const password = passwordInput.value;
        const strength = getPasswordStrength(password);
        const fill = overlay.querySelector('.strength-fill');
        const message = overlay.querySelector('.password-feedback');
        const percent = password ? (strength.score / 3) * 100 : 0;
        fill.style.width = `${percent}%`;
        fill.style.background = strength.color;
        message.innerHTML = `<strong style="color:${strength.color}">${strength.label}</strong> Use 8+ characters and mix letters, numbers, symbols.`;
      }

      function togglePasswordVisibility(button) {
        const wrap = button.closest('.password-wrap');
        const input = wrap.querySelector('input');
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        button.textContent = isPassword ? 'Hide' : 'Show';
      }

      overlay.querySelectorAll('.password-toggle').forEach(button => {
        button.addEventListener('click', () => togglePasswordVisibility(button));
      });

      usernameInput.addEventListener('input', () => {
        const error = validateUsername(usernameInput.value);
        const errorBox = overlay.querySelector('[data-user-error]');
        errorBox.textContent = error;
      });

      passwordInput.addEventListener('input', updateStrength);
      firstNameInput.addEventListener('input', updateStepUI);
      lastNameInput.addEventListener('input', updateStepUI);
      usernameInput.addEventListener('input', updateStepUI);
      bioInput.addEventListener('input', updateStepUI);
      overlay.querySelector('input[name="location"]').addEventListener('input', updateStepUI);
      overlay.querySelector('input[name="email"]').addEventListener('input', updateStepUI);
      overlay.querySelector('input[name="birthday"]').addEventListener('input', updateStepUI);

      nextButton.addEventListener('click', () => {
        if (step === 1) {
          if (!firstNameInput.value.trim() || !lastNameInput.value.trim()) {
            showToast('Add your first and last name.');
            return;
          }
          const usernameError = validateUsername(usernameInput.value);
          if (usernameError) {
            showToast(usernameError);
            return;
          }
          if (!overlay.querySelector('input[name="email"]').value.trim()) {
            showToast('Add your email address.');
            return;
          }
          if (!passwordInput.value || passwordInput.value.length < 8) {
            showToast('Password must be at least 8 characters long.');
            return;
          }
          if (passwordInput.value !== confirmInput.value) {
            showToast('Passwords do not match.');
            return;
          }
          step = 2;
          updateStepUI();
          return;
        }

        if (step === 2) {
          step = 3;
          updateStepUI();
          return;
        }

        if (step === 3) {
          const check = document.getElementById('termsCheck');
          if (!check.checked) {
            showToast('You must accept the terms before creating your account.');
            return;
          }

          const first = firstNameInput.value.trim();
          const middle = overlay.querySelector('input[name="middleName"]').value.trim();
          const last = lastNameInput.value.trim();
          const fullName = [first, middle, last].filter(Boolean).join(' ');
          const username = usernameInput.value.trim();
          const normalizedUser = username.startsWith('@') ? username : '@' + username;
          const email = overlay.querySelector('input[name="email"]').value.trim();
          const password = passwordInput.value.trim();

          state.loggedIn = true;
          state.currentUser = {
            name: fullName,
            email,
            username: normalizedUser
          };
          state.users.me = { ...state.currentUser };

          if (!state.posts.some(post => post.author === 'me')) {
            state.posts.unshift({
              id: Date.now(),
              author: 'me',
              text: 'Just joined Murmur. Hello, everyone!',
              likes: 0,
              liked: false
            });
          }

          saveState();
          overlay.remove();
          showApp();
          showToast('Account created successfully!');
        }
      });

      backButton.addEventListener('click', () => {
        if (step > 1) {
          step -= 1;
          updateStepUI();
        }
      });

      closeButton.addEventListener('click', () => overlay.remove());
      overlay.addEventListener('click', (event) => {
        if (event.target === overlay) overlay.remove();
      });

      updateStepUI();
      updateStrength();
    }

    function login(email, password) {
      const normalized = String(email || '').trim();
      if (!normalized || !String(password || '').trim()) {
        authError.textContent = 'Enter both email and password.';
        return;
      }
      if (!normalized.includes('@')) {
        authError.textContent = 'Use a valid email address.';
        return;
      }
      state.loggedIn = true;
      state.currentUser = { name: 'Maya Chen', email: normalized, username: '@maya' };
      state.users.me = { name: 'Maya Chen', email: normalized, username: '@maya' };
      saveState();
      showApp();
    }

    function resetPassword() {
      const email = document.getElementById('email').value.trim();
      if (!email) {
        authError.textContent = 'Add your email address first.';
        return;
      }
      authError.textContent = 'Password reset mail sent to ' + email + '.';
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;
      const chatId = state.activeChat || 'ava';
      if (!state.conversations[chatId]) state.conversations[chatId] = [];
      state.conversations[chatId].push({ from: 'me', text, time: 'now' });
      state.alerts.unshift({ id: Date.now(), title: 'Message sent', text: `You sent a message to ${getUserById(chatId).name}.`, time: 'just now', unread: false });
      saveState();
      input.value = '';
      renderChats();
      renderConversation();
      renderAlerts();
    }

    function createPost() {
      const input = document.getElementById('postInput');
      const text = input.value.trim();
      if (!text) return;
      state.posts.unshift({ id: Date.now(), author: 'me', text, likes: 0, liked: false });
      input.value = '';
      saveState();
      renderPosts();
    }

    document.getElementById('loginBtn').addEventListener('click', () => {
      login(document.getElementById('email').value, document.getElementById('password').value);
    });
    document.getElementById('createBtn').addEventListener('click', openRegisterWizard);
    document.getElementById('resetBtn').addEventListener('click', resetPassword);
    document.getElementById('postBtn').addEventListener('click', createPost);
    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('logoutBtn').addEventListener('click', () => {
      state.loggedIn = false;
      saveState();
      showAuth();
    });
    document.getElementById('messageInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') sendMessage();
    });
    document.getElementById('postInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') createPost();
    });
    document.getElementById('chatSearch').addEventListener('input', e => {
      const q = e.target.value.trim().toLowerCase();
      const list = document.getElementById('chatList');
      list.querySelectorAll('.chat-item').forEach(item => {
        const name = item.textContent.toLowerCase();
        item.style.display = q && !name.includes(q) ? 'none' : 'flex';
      });
    });

    document.querySelectorAll('[data-view]').forEach(btn => {
      btn.addEventListener('click', () => setView(btn.dataset.view));
    });

    document.addEventListener('click', e => {
      const likeBtn = e.target.closest('[data-like]');
      if (!likeBtn) return;
      const id = Number(likeBtn.dataset.like);
      const post = state.posts.find(p => p.id === id);
      if (!post) return;
      post.liked = !post.liked;
      post.likes += post.liked ? 1 : -1;
      saveState();
      renderPosts();
    });

    setTimeout(() => {
      splash.remove();
      if (state.loggedIn) showApp();
      else showAuth();
    }, 1100);
  </script>
</body>
</html>
